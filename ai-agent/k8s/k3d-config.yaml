apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ai-agent-cluster
servers: 1
agents: 1
ports:
  - port: 8000:8000
    nodeFilters:
      - loadbalancer
  - port: 3000:3000
    nodeFilters:
      - loadbalancer
  - port: 5432:5432
    nodeFilters:
      - loadbalancer
  - port: 80:80
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true

