apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-agent

resources:
  - manifests/namespace.yaml
  - manifests/serviceaccount.yaml
  - manifests/rbac.yaml
  - manifests/configmap.yaml
  - manifests/postgres.yaml
  - manifests/backend-deployment.yaml
  - manifests/backend-service.yaml
  - manifests/frontend-deployment.yaml
  - manifests/frontend-service.yaml
  - manifests/networkpolicy.yaml
#  - manifests/ingress.yaml
#  - manifests/servicemonitor.yaml

images:
  - name: docker.io/devopscube/ai-agent-backend
    newTag: v1.7.1
  - name: docker.io/devopscube/ai-agent-frontend
    newTag: v1.8.2

replicas:
  - name: ai-agent-backend
    count: 1
  - name: ai-agent-frontend
    count: 1

configMapGenerator:
  - name: ai-agent-config
    namespace: ai-agent
    behavior: merge
    options:
      disableNameSuffixHash: true
    literals:
      - LLM_PROVIDER=meshapi
      - MESH_BASE_URL=https://api.meshapi.ai/v1
      - DIAGNOSTICS_MODEL_ID=openai/gpt-4o-mini
      - REMEDIATION_MODEL_ID=openai/gpt-4o-mini
      - REQUIRE_APPROVAL=true
      - DIAGNOSTICS_MODEL_PRICE_INPUT_PER_1K=0.00015
      - DIAGNOSTICS_MODEL_PRICE_OUTPUT_PER_1K=0.00060
      - REMEDIATION_MODEL_PRICE_INPUT_PER_1K=0.00015
      - REMEDIATION_MODEL_PRICE_OUTPUT_PER_1K=0.00060

secretGenerator:
  - name: ai-agent-secrets
    namespace: ai-agent
    options:
      disableNameSuffixHash: true
    literals:
      - DATABASE_PASSWORD=changeme
      - MESH_API_KEY=your-mesh-api-key
  - name: ai-agent-postgres-secrets
    namespace: ai-agent
    literals:
      - POSTGRES_PASSWORD=changeme
